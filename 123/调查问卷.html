<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆读者调查问卷</title>
    <style>
        .box{
            border:3px solid #f3a8d8;
            padding:15px;
            max-width:700px;
            margin:0 auto;
        }
        h2{
            text-align:center;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>图书馆读者调查问卷</h2>
    <p>为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！</p>
    <form>
        <p>1.您的年级<br>
            请你选择：
            <select>
                <option>请你选择</option>
            </select>
        </p>
        <p>2.您的专业<br>
            <input type="text" size="40">
        </p>
        <p>3.对于图书馆的阅览环境<br>
            <input type="radio" name="env">满意<br>
            <input type="radio" name="env">基本满意<br>
            <input type="radio" name="env">不满意
            您的建议：<input type="text">
        </p>
        <p>4.您到图书馆的原因是（可多选）：<br>
            <input type="checkbox">借阅专业图书<br>
            <input type="checkbox">随便坐坐，翻翻书刊<br>
            <input type="checkbox">借阅光盘<br>
            <input type="checkbox">参加图书馆组织的活动<br>
            <input type="checkbox">自习，复习功课<br>
            <input type="checkbox">上网<br>
            <input type="checkbox">检索电子文献
        </p>
        <p>5.您到图书馆的频率<br>
            <input type="radio" name="freq">几乎每天<br>
            <input type="radio" name="freq">每周1‑2次<br>
            <input type="radio" name="freq">每月1‑2次<br>
            <input type="radio" name="freq">几乎不去
        </p>
        <p>6.您对学校的建议<br>
            请您提出宝贵建议：<br>
            <textarea rows="7" cols="60"></textarea>
        </p>
        <div align="center">
            <input type="submit" value="提交答案">
            <input type="reset" value="清 空">
        </div>
    </form>
</div>
</body>
</html>
