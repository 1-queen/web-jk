<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单的应用</title>
</head>
<body>
    <form action="" method="post"></form>
    <table align="center">
        <caption>青春不常在，抓紧谈恋爱</caption>
        <tr>
            <td><span>姓名</span></td>
            <td><input type="text" placeholder="请输入真实姓名！"></td>
        </tr>
        <tr>
            <td><span>性别</span></td>
            <td><input type="radio" name ="xb">男<input type="radio" name="xb">女</td>
        </tr>
        <tr>
            <td><span>出生日期</span></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><span>常住地</span></td>
            <td>
                <select name="" id="">
                    <option value="">四川</option>
                    <option value="">贵州</option>
                    <option value="">成都</option>
                    <option value="">马边</option>
                    <option value="">喜德</option>
                    <option value="">美姑</option>
                    <option value="">山西</option>
                    <option value="">海南</option>
                    <option value="">青岛</option>
                    <option value="">云南</option>
                </select>
            </td>
            
        </tr>
        <tr>
            <td><span>学历</span></td>
            <td>
                <select name="" id="">
                    <option value="">小学</option>
                    <option value="">大学</option>
                    <option value="">初中</option>
                    <option value="">中专</option>
                    <option value="">高中</option>
                    <option value="">硕士</option>
                    <option value="">大专</option>
                    <option value="">本科</option>
                    <option value="">研究生</option>
                    <option value="">博士</option>
                </select>
            </td>
            
        </tr>
        <tr>
            <td><span>手机号码</span></td>
            <td><input type="tel" pattern="1[0-9]{3}-[0-9]{2}-[0-9]{3}"></td>
        </tr>
        <tr>
            <td><span>邮箱</span></td>
            <td><input type="eamil"></td>
        </tr>

        <tr>
            <td><span>创建密码</span></td>
            <td><input type="password" placeholder="最少6位含字母和数字的密码"></td>
        </tr>
        <tr>
            <td><span>兴趣爱好</span></td>
            <td><input type="checkbox">唱歌
                <input type="checkbox">跳舞
                <input type="checkbox">rep
                <input type="checkbox">游戏
                <input type="checkbox">爬山
                <input type="checkbox">睡觉
                <input type="checkbox">跑步

            </td>
        </tr>
        <tr>
            <td><span>喜欢的颜色</span></td>
            <td><input type="color"></td>
        </tr>
        <tr>
            <td><span>幸运数字</span></td>
            <td><input type="number" min="0" max="100">0 <input type="text"> </td>
        </tr>
        <tr>
    <td><span>自我介绍</span></td>
    <td><textarea name="" id="" rows="5" cols="30"></textarea></td>
</tr>
<tr>
    <td><span>个人照片</span></td>
    <td><input type="file"></td>
</tr>
<tr>
    <td></td>
    <td>
        <button>注册</button>
        <input type="button" value="注册">
        <input type="submit">
        <input type="reset" value="清空">
    </td>
</tr>

    </table>
</body>
</html>
