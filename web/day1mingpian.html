<!DOCTYPE html>
<!--
  文件名：index.html
  用途：简约风格个人名片网页 —— 页面结构层（HTML5 + 语义化标签）
  说明：本文件只负责页面结构，所有样式统一放在 style.css 中，
        HTML 结构与 CSS 样式完全分离书写，便于后期维护。
-->
<html lang="zh-CN">
<head>
    <!-- 字符编码：UTF-8，确保中文正常显示 -->
    <meta charset="UTF-8">
    <!-- 视口设置：适配桌面与移动设备的响应式宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页标题 -->
    <title>个人名片 · 张三</title>
    <!-- 关联外部样式表：实现结构与样式分离（唯一引入方式） -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--
        名片主体：使用 <main> 语义化标签包裹名片卡片。
        <main> 标签代表页面主体内容，一个页面仅使用一次。
    -->
    <main class="card">

        <!-- ==================== 头像区域 ==================== -->
        <!--
            <figure> 是带语义的内容容器，适合包裹头像。
            默认使用 CSS 渐变圆 + 姓氏文字作为占位头像，
            如需替换成真实照片，请将下方模块替换为：
            <figure class="avatar">
                <img src="你的头像图片.jpg" alt="头像">
            </figure>
        -->
        <figure class="avatar" aria-label="头像：姓名首字">
            <!-- 占位头像文字：可改为任意姓氏或首字母 -->
            <span class="avatar-text">吉克</span>
        </figure>

        <!-- ==================== 基本身份信息 ==================== -->
        <!-- 姓名：一级标题，语义上代表卡片核心内容 -->
        <h1 class="name">吉克罗子</h1>
        <!-- 职位：使用 <p> 标签，配合类名便于单独设置样式 -->
        <p class="job-title">前端开发工程师</p>

        <!-- ==================== 联系方式 ==================== -->
        <!--
            联系方式列表：使用 <ul> 列表结构，语义清晰。
            每项为 <li>，内含一个内联 SVG 图标 + 对应联系信息。
        -->
        <ul class="contact-list">

            <!-- 邮箱项 -->
            <li class="contact-item">
                <!-- SVG 图标：信封造型，stroke 颜色继承父元素文字色 -->
                <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="4" width="16" height="12" rx="1"/>
                    <path d="M19 10 L22 16 H19"/>
                </svg>
                <a class="contact-link" href="mailto:jikeluozi@example.com">jikeluozi@example.com</a>
            </li>

            <!-- 电话项 -->
            <li class="contact-item">
                <!-- SVG 图标：电话造型，样式同上 -->
                <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="7" y="2" width="10" height="13" rx="2"/>
                    <path d="M7 15 L12 19 H20"/>
                </svg>
                <a class="contact-link" href="tel:+8613800000000">+86 138 0000 0000</a>
            </li>

            <!-- 地址项 -->
            <li class="contact-item">
                <!-- SVG 图标：外圆 + 中心点构成简洁的定位符号 -->
                <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="8"/>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                </svg>
                <span class="contact-text">四川省 · 成都市</span>
            </li>
        </ul>

    </main>
</body>
</html>
